<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja y Reportes - UE San José</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
    <style>
        .metric-card {
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .metric-title { font-size: 1rem; color: #aaa; margin-bottom: 0.5rem; }
        .metric-value { font-size: 2rem; font-weight: bold; margin: 0; }
        .text-green { color: #00A8CC; }
        .text-red { color: #ff4444; }
        .text-gold { color: var(--gold-color); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <img src="images/logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/50?text=27'">
            <h1>UE San José</h1>
        </div>
        <div class="nav-links">
            <a href="index.html" class="admin-hide"><i class="fas fa-money-bill-wave"></i> Cobros</a>
            <a href="estado_pagos.html"><i class="fas fa-list-check"></i> Estado de Pagos</a>
            <a href="padres_registrados.html"><i class="fas fa-user-friends"></i> Padres</a>
            <a href="caja_informe.html" class="active admin-hide"><i class="fas fa-wallet"></i> Caja y Reportes</a>
            <a href="importar_excel.html" class="admin-hide"><i class="fas fa-file-excel"></i> Importar</a>
            <a href="estudiantes.html"><i class="fas fa-users"></i> Inscritos</a>
            <a href="cambiar_password.html"><i class="fas fa-key"></i> Mi Cuenta</a>
            <a href="#" id="btnLogout" onclick="logout(); return false;" style="color:#ff6b6b;"><i class="fas fa-sign-out-alt"></i> Salir</a>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-grid">
            
            <div class="glass-panel" style="grid-column: 1 / 3;">
                <h2 style="color: var(--gold-color); margin-top: 0;"><i class="fas fa-chart-line"></i> Informe de Caja</h2>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
                    <div class="metric-card">
                        <div class="metric-title">Total Ingresos</div>
                        <div class="metric-value text-green" id="lblIngresos">0.00 Bs</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-title">Total Egresos</div>
                        <div class="metric-value text-red" id="lblEgresos">0.00 Bs</div>
                    </div>
                    <div class="metric-card" style="background: rgba(255,215,0,0.1); border-color: var(--gold-color);">
                        <div class="metric-title" style="color: var(--gold-color);">Saldo Actual</div>
                        <div class="metric-value text-gold" id="lblSaldo">0.00 Bs</div>
                    </div>
                </div>

                <h3 style="color: white; margin-bottom: 1rem;">Últimos Movimientos</h3>
                <div class="table-container" style="max-height: 400px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Tipo</th>
                                <th>Descripción</th>
                                <th>Monto</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyTransacciones">
                            <!-- Llenado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="glass-panel" style="grid-column: 3 / 4; align-self: start; padding: 1.2rem;">
                <h4 id="tituloMovimiento" style="color: #00A8CC; margin-top: 0; margin-bottom: 1rem; white-space: nowrap; font-size: 1.25rem;"><i class="fas fa-money-bill-transfer"></i> Registrar Movimiento</h4>
                
                <form id="formMovimiento">
                    <div class="form-group" style="margin-bottom: 0.8rem;">
                        <label style="font-size: 0.85rem;">Tipo de Movimiento:</label>
                        <select id="tipoMovimiento" class="form-control" required onchange="cambiarEstiloMovimiento()">
                            <option value="ingreso">Ingreso (Actividades, Kermes)</option>
                            <option value="egreso">Egreso (Gastos, Dirección)</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0.8rem;">
                        <label style="font-size: 0.85rem;">Monto (Bs):</label>
                        <input type="number" id="montoMov" class="form-control" step="0.5" required min="1">
                    </div>
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label style="font-size: 0.85rem;">Descripción / Concepto:</label>
                        <textarea id="descMov" class="form-control" rows="2" required placeholder="Detalle el motivo..."></textarea>
                    </div>
                    <button type="submit" class="btn" style="background: #00A8CC; color: white; width: 100%; font-size: 0.9rem;" id="btnMovimiento">
                        <i class="fas fa-plus-circle"></i> Registrar Ingreso
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        async function cargarCaja() {
            try {
                const res = await fetchWithAuth('/api/caja/informe');
                const data = await res.json();
                
                document.getElementById('lblIngresos').innerText = `${data.total_ingresos.toFixed(2)} Bs`;
                document.getElementById('lblEgresos').innerText = `${data.total_egresos.toFixed(2)} Bs`;
                document.getElementById('lblSaldo').innerText = `${data.saldo_actual.toFixed(2)} Bs`;
                
                const tbody = document.getElementById('tbodyTransacciones');
                tbody.innerHTML = '';
                
                data.transacciones.forEach(t => {
                    const tr = document.createElement('tr');
                    const fecha = new Date(t.fecha).toLocaleString();
                    const color = t.tipo === 'ingreso' ? '#00A8CC' : '#ff4444';
                    const signo = t.tipo === 'ingreso' ? '+' : '-';
                    const icon = t.tipo === 'ingreso' ? 'arrow-down' : 'arrow-up';
                    
                    tr.innerHTML = `
                        <td style="font-size: 0.9rem; color: #aaa;">${fecha}</td>
                        <td style="color: ${color};"><i class="fas fa-${icon}"></i> ${t.tipo.toUpperCase()}</td>
                        <td>${t.descripcion}</td>
                        <td style="color: ${color}; font-weight: bold;">${signo}${t.monto.toFixed(2)} Bs</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
            }
        }

        window.cambiarEstiloMovimiento = function() {
            const tipo = document.getElementById('tipoMovimiento').value;
            const btn = document.getElementById('btnMovimiento');
            const titulo = document.getElementById('tituloMovimiento');
            
            if (tipo === 'ingreso') {
                btn.style.background = '#00A8CC';
                btn.innerHTML = '<i class="fas fa-plus-circle"></i> Registrar Ingreso';
                titulo.style.color = '#00A8CC';
            } else {
                btn.style.background = '#ff4444';
                btn.innerHTML = '<i class="fas fa-minus-circle"></i> Registrar Salida';
                titulo.style.color = '#ff4444';
            }
        };

        document.getElementById('formMovimiento').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnMovimiento');
            const tipo = document.getElementById('tipoMovimiento').value;
            const monto = parseFloat(document.getElementById('montoMov').value);
            const desc = document.getElementById('descMov').value;
            
            btn.disabled = true;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';
            
            try {
                const res = await fetchWithAuth('/api/caja/movimientos', {
                    method: 'POST',
                    body: JSON.stringify({
                        tipo: tipo,
                        monto: monto,
                        descripcion: desc
                    })
                });
                
                if (res.ok) {
                    alert("Movimiento registrado correctamente.");
                    document.getElementById('formMovimiento').reset();
                    cambiarEstiloMovimiento(); // restaurar estilo
                    cargarCaja();
                } else {
                    const err = await res.json();
                    alert(err.detail || "Error al registrar.");
                }
            } catch (error) {
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        });

        document.addEventListener('DOMContentLoaded', cargarCaja);
    </script>
</body>
</html>
