<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Pagos - UE San José</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
    <style>
        .badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-success { background: rgba(0, 176, 80, 0.2); color: #00A8CC; border: 1px solid #00A8CC; }
        .badge-danger { background: rgba(255, 68, 68, 0.2); color: #ff4444; border: 1px solid #ff4444; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <img src="images/logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/50?text=27'">
            <h1>UE San José</h1>
        </div>
        <div class="nav-links">
            <a href="index.html" class="admin-hide"><i class="fas fa-money-bill-wave"></i> Cobros</a>
            <a href="estado_pagos.html" class="active"><i class="fas fa-list-check"></i> Estado de Pagos</a>
            <a href="padres_registrados.html"><i class="fas fa-user-friends"></i> Padres</a>
            <a href="caja_informe.html" class="admin-hide"><i class="fas fa-wallet"></i> Caja y Reportes</a>
            <a href="importar_excel.html" class="admin-hide"><i class="fas fa-file-excel"></i> Importar</a>
            <a href="estudiantes.html"><i class="fas fa-users"></i> Inscritos</a>
            <a href="cambiar_password.html"><i class="fas fa-key"></i> Mi Cuenta</a>
            <a href="#" id="btnLogout" onclick="logout(); return false;" style="color:#ff6b6b;"><i class="fas fa-sign-out-alt"></i> Salir</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 style="color: var(--gold-color); margin-top: 0; margin-bottom: 0;"><i class="fas fa-list-check"></i> Auditoría de Pagos por Curso</h2>
                <button id="btnExportar" class="btn btn-info" style="background: #00A8CC; border: none; color: white;" onclick="exportarExcel()"><i class="fas fa-file-excel"></i> Exportar</button>
            </div>
            
            <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                <div class="form-group" style="flex: 1;">
                    <label>Curso:</label>
                    <select id="selectCurso" class="form-control">
                        <option value="">Todos los cursos</option>
                        <option value="1ro Secundaria">1ro Secundaria</option>
                        <option value="2do Secundaria">2do Secundaria</option>
                        <option value="3ro Secundaria">3ro Secundaria</option>
                        <option value="4to Secundaria">4to Secundaria</option>
                        <option value="5to Secundaria">5to Secundaria</option>
                        <option value="6to Secundaria">6to Secundaria</option>
                    </select>
                </div>
                <div class="form-group" style="width: 150px;">
                    <label>Paralelo:</label>
                    <select id="selectParalelo" class="form-control">
                        <option value="">Todos</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </div>
                <div class="form-group" style="width: 200px;">
                    <label>Estado:</label>
                    <select id="selectEstado" class="form-control">
                        <option value="">Todos</option>
                        <option value="Cancelado">Cancelado</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="Retirado">Retirados (Baja)</option>
                        <option value="Nuevo">Nuevos Ingresos</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button id="btnFiltrar" class="btn btn-primary"><i class="fas fa-filter"></i> Filtrar</button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>N°</th>
                            <th>Estudiante</th>
                            <th>Curso / Paralelo</th>
                            <th>C.I.</th>
                            <th>Estado de Pago</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyEstadoPagos">
                        <!-- Llenado por JS -->
                    </tbody>
                </table>
            </div>
            
            <div style="margin-top: 2rem; display: flex; gap: 2rem;">
                <div class="glass-panel" style="flex: 1; text-align: center;">
                    <h3>Total Estudiantes</h3>
                    <h2 id="totalEst" style="color: white; margin: 0;">0</h2>
                </div>
                <div class="glass-panel" style="flex: 1; text-align: center;">
                    <h3 style="color: #00A8CC;">Cancelados</h3>
                    <h2 id="totalCancelados" style="color: #00A8CC; margin: 0;">0</h2>
                </div>
                <div class="glass-panel" style="flex: 1; text-align: center;">
                    <h3 style="color: #ff4444;">Pendientes</h3>
                    <h2 id="totalPendientes" style="color: #ff4444; margin: 0;">0</h2>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.currentEstudiantesData = [];

        document.addEventListener('DOMContentLoaded', () => {
            const btnFiltrar = document.getElementById('btnFiltrar');
            
            btnFiltrar.addEventListener('click', async () => {
                const curso = document.getElementById('selectCurso').value;
                const paralelo = document.getElementById('selectParalelo').value;
                const estado = document.getElementById('selectEstado').value;
                
                let url = `/api/estudiantes?limit=1000`;
                if (curso) url += `&curso=${encodeURIComponent(curso)}`;
                if (paralelo) url += `&paralelo=${encodeURIComponent(paralelo)}`;
                if (estado) url += `&estado_pago=${encodeURIComponent(estado)}`;
                
                btnFiltrar.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                
                try {
                    const res = await fetchWithAuth(url);
                    const data = await res.json();
                    window.currentEstudiantesData = data;
                    
                    const tbody = document.getElementById('tbodyEstadoPagos');
                    tbody.innerHTML = '';
                    
                    let cancelados = 0;
                    let pendientes = 0;
                    
                    data.forEach((est, idx) => {
                        if (est.estado_pago !== 'Pendiente') cancelados++;
                        else pendientes++;
                        
                        let estadoText = est.estado_pago;
                        if (estadoText && estadoText.split(',').length >= 10 && estadoText !== 'Pendiente') {
                            estadoText = 'Gestión Completa (10 meses)';
                        }
                        
                        const badgeClass = est.estado_pago === 'Pendiente' ? 'badge-danger' : 'badge-success';
                        let badgeHtml = `<span class="badge ${badgeClass}">${estadoText}</span>`;
                        
                        const btnColor = est.estado_matricula === 'Retirado' ? '#ff9800' : '#888';
                        const btnIcon = est.estado_matricula === 'Retirado' ? 'fa-user-check' : 'fa-user-times';
                        const btnTitle = est.estado_matricula === 'Retirado' ? 'Reactivar' : 'Dar de Baja';
                        
                        const btnNuevoColor = est.estado_matricula === 'Nuevo' ? '#00A8CC' : '#444';
                        const btnNuevoTitle = est.estado_matricula === 'Nuevo' ? 'Quitar Nuevo' : 'Marcar Nuevo';
                        
                        const btnHtml = `
                            <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                                <button class="btn" title="${btnTitle}" style="background: ${btnColor}; color: white; padding: 4px 8px; font-size: 0.8rem; white-space: nowrap;" onclick="darDeBaja(${est.id}, '${est.nombres}')"><i class="fas ${btnIcon}"></i> ${btnTitle}</button>
                                <button class="btn" title="${btnNuevoTitle}" style="background: ${btnNuevoColor}; color: white; padding: 4px 8px; font-size: 0.8rem; white-space: nowrap;" onclick="marcarNuevo(${est.id}, '${est.nombres}')"><i class="fas fa-star"></i> ${btnNuevoTitle}</button>
                            </div>
                        `;

                        if (est.estado_matricula === 'Retirado') {
                            badgeHtml += ` <br><span class="badge badge-danger" style="margin-top:4px; display:inline-block;">Retirado</span>`;
                        } else if (est.estado_matricula === 'Nuevo') {
                            badgeHtml += ` <br><span class="badge badge-info" style="margin-top:4px; display:inline-block; background: #00A8CC;">Nuevo Ingreso</span>`;
                        }

                        const styleRow = est.estado_matricula === 'Retirado' ? 'color: #ff4444; text-decoration: line-through;' : '';

                        const tr = document.createElement('tr');
                        tr.style.cssText = styleRow;
                        tr.innerHTML = `
                            <td>${idx + 1}</td>
                            <td>${est.apellidos} ${est.nombres}</td>
                            <td>${est.curso} "${est.paralelo}"</td>
                            <td>${est.ci || '-'}</td>
                            <td>${badgeHtml}</td>
                            <td>${btnHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                    
                    document.getElementById('totalEst').innerText = data.length;
                    document.getElementById('totalCancelados').innerText = cancelados;
                    document.getElementById('totalPendientes').innerText = pendientes;
                    
                } catch (error) {
                    console.error(error);
                } finally {
                    btnFiltrar.innerHTML = '<i class="fas fa-filter"></i> Filtrar';
                }
            });
            
            // Auto load
            btnFiltrar.click();
        });

        window.darDeBaja = async function(id, nombre) {
            if (!confirm(`¿Cambiar estado de Retirado/Activo para ${nombre}?`)) return;
            try {
                const response = await fetchWithAuth(`/api/estudiantes/${id}/baja`, { method: 'PUT' });
                if (response.ok) document.getElementById('btnFiltrar').click();
                else alert("Error al cambiar estado.");
            } catch (error) {
                console.error(error);
            }
        };
        
        window.marcarNuevo = async function(id, nombre) {
            if (!confirm(`¿Cambiar estado de Nuevo Ingreso para ${nombre}?`)) return;
            try {
                const response = await fetchWithAuth(`/api/estudiantes/${id}/nuevo`, { method: 'PUT' });
                if (response.ok) document.getElementById('btnFiltrar').click();
                else alert("Error al cambiar estado.");
            } catch (error) {
                console.error(error);
            }
        };


        window.exportarExcel = function() {
            if (!window.currentEstudiantesData || window.currentEstudiantesData.length === 0) {
                alert("No hay datos para exportar. Por favor filtre primero.");
                return;
            }

            let xls_html = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
            <meta charset="utf-8">
            <head><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Reporte Pagos</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head>
            <body>
            <table border="1">
                <tr>
                    <th style="background-color:#FFD700; color:black;">N°</th>
                    <th style="background-color:#FFD700; color:black;">Estudiante</th>
                    <th style="background-color:#FFD700; color:black;">Curso</th>
                    <th style="background-color:#FFD700; color:black;">Paralelo</th>
                    <th style="background-color:#FFD700; color:black;">C.I.</th>
                    <th style="background-color:#FFD700; color:black;">Estado de Pago</th>
                    <th style="background-color:#FFD700; color:black;">Situación (Matrícula)</th>
                </tr>`;

            window.currentEstudiantesData.forEach((est, index) => {
                let situacion = est.estado_matricula;
                let estado_pago = est.estado_pago || 'Pendiente';
                
                xls_html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${est.nombres} ${est.apellidos}</td>
                    <td>${est.curso}</td>
                    <td>${est.paralelo}</td>
                    <td>${est.ci || '-'}</td>
                    <td>${estado_pago}</td>
                    <td>${situacion}</td>
                </tr>`;
            });

            xls_html += `</table></body></html>`;

            const blob = new Blob([xls_html], { type: 'application/vnd.ms-excel' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            
            const curso = document.getElementById('selectCurso').value || 'Todos';
            const paralelo = document.getElementById('selectParalelo').value || 'Todos';
            const estado = document.getElementById('selectEstado').value || 'Todos';
            
            let filename = `Reporte_${curso}_${paralelo}_${estado}.xls`;
            filename = filename.replace(/ /g, '_');
            
            link.setAttribute("download", filename);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>
</html>
